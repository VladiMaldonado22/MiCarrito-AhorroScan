<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VladiScan — Controlá tu carrito en el súper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #eef2ff 0%, #f3e8ff 50%, #e0f2fe 100%);
    --card-bg: #ffffff;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --accent-green: #10b981;
    --accent-green-soft: #d1fae5;
    --accent-amber: #f59e0b;
    --danger: #ef4444;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --line: #e2e8f0;
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    background: var(--bg-gradient);
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 12px 60px;
  }

  .receipt {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 20px 40px -15px rgba(79, 70, 229, 0.15), 0 0 1px 1px rgba(0, 0, 0, 0.05);
    position: relative;
    overflow: hidden;
  }

  header {
    padding: 24px 22px 18px;
    text-align: center;
    background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
    border-bottom: 2px dashed var(--line);
    position: relative;
  }

  header .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #e0e7ff;
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  header h1 {
    font-size: 32px;
    font-weight: 800;
    margin: 0 0 4px;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #312e81, #4f46e5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header .sub {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .scan-zone { padding: 18px 18px 10px; }
  
  .viewfinder {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #0f172a;
    overflow: hidden;
    border-radius: var(--radius);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }

  video, canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  canvas { display: none; }

  .viewfinder .frame {
    position: absolute;
    inset: 28% 10%;
    border: 2px solid var(--accent-green);
    border-radius: 8px;
    pointer-events: none;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    overflow: hidden;
  }

  /* Animación del láser escáner */
  .viewfinder .frame::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
    box-shadow: 0 0 8px var(--accent-green);
    animation: scanLine 2s infinite ease-in-out;
  }

  @keyframes scanLine {
    0% { top: 0%; }
    50% { top: 96%; }
    100% { top: 0%; }
  }

  .viewfinder .frame .tag {
    position: absolute;
    top: 6px; left: 8px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-green);
    letter-spacing: 0.05em;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(4px);
    padding: 3px 7px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .cam-status {
    position: absolute;
    bottom: 10px; left: 10px; right: 10px;
    font-size: 11px;
    font-weight: 600;
    color: #f8fafc;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(4px);
    padding: 8px 10px;
    border-radius: 6px;
    text-align: center;
  }

  .capture-row {
    display: flex; gap: 8px; margin-top: 12px;
  }

  button {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    cursor: pointer;
    border: none;
    border-radius: var(--radius);
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, #4f46e5, #3b82f6);
    color: #ffffff;
    padding: 12px 16px;
    font-size: 14px;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
  }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: 0.5; transform: none; box-shadow: none; cursor: not-allowed; }

  #captureBtn { flex: 1; }

  .manual-toggle {
    display: block;
    width: 100%;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    margin-top: 12px;
    background: none;
    text-decoration: none;
  }
  .manual-toggle:hover { text-decoration: underline; }

  .manual-row {
    display: none;
    gap: 8px;
    margin-top: 10px;
  }
  .manual-row.open { display: flex; }

  .manual-row input {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    border: 2px solid var(--line);
    background: #f8fafc;
    border-radius: var(--radius);
    color: var(--text-main);
    outline: none;
  }
  .manual-row input:focus { border-color: var(--primary); background: #fff; }

  .items { padding: 6px 22px 10px; min-height: 80px; }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 28px 10px;
    border: 2px dashed var(--line);
    margin-top: 10px;
    border-radius: var(--radius);
    background: #fafafa;
  }

  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    animation: printIn 0.25s cubic-bezier(0, 0, 0.2, 1);
  }

  @keyframes printIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .item-row .name {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 600;
    color: var(--text-main);
  }

  .item-row .price {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    background: var(--accent-green-soft);
    color: #065f46;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .item-row .remove {
    background: #fee2e2;
    border: none;
    color: var(--danger);
    width: 24px; height: 24px;
    border-radius: 50%;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-weight: 800;
    line-height: 1;
  }
  .item-row .remove:hover { background: var(--danger); color: #fff; }

  .total-block {
    margin: 8px 18px 0;
    padding: 16px;
    background: linear-gradient(135deg, #1e1b4b, #312e81);
    border-radius: var(--radius);
    color: #fff;
    box-shadow: 0 10px 20px -5px rgba(49, 46, 129, 0.3);
  }

  .total-line {
    display: flex; justify-content: space-between;
    font-size: 12px; color: #c7d2fe; font-weight: 600; padding: 2px 0;
  }

  .total-line.grand {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    margin-top: 6px;
  }

  .total-line.grand span:last-child {
    font-family: 'IBM Plex Mono', monospace;
    color: #34d399;
  }

  footer { padding: 18px 18px 22px; }

  .footer-actions { display: flex; gap: 10px; }
  .footer-actions button { flex: 1; padding: 12px; font-size: 13px; }

  .btn-secondary {
    background: #f1f5f9;
    color: var(--text-main);
    border: 1px solid var(--line);
  }
  .btn-secondary:hover { background: #e2e8f0; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50;
  }

  .modal {
    background: var(--card-bg);
    width: 100%; max-width: 440px;
    border-radius: 20px 20px 0 0;
    padding: 22px 22px 28px;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
    animation: slideUp 0.25s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal .eyebrow {
    font-size: 11px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .modal h2 {
    font-size: 15px; margin: 4px 0 14px;
    color: var(--text-muted); font-weight: 600;
  }

  .modal label {
    display: block; font-size: 12px; font-weight: 700;
    color: var(--text-main); margin-bottom: 6px; margin-top: 14px;
  }

  .modal input {
    width: 100%;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    outline: none;
  }
  .modal input:focus { border-color: var(--primary); }

  #modalPrice {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    color: #065f46;
    background: #ecfdf5;
    border-color: #a7f3d0;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 13px; font-size: 14px; }

  .thumb-preview {
    width: 100%;
    max-height: 120px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 10px;
    border: 2px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce) {
    .item-row { animation: none; }
    .viewfinder .frame::after { animation: none; }
  }
</style>
</head>
<body>

<div class="receipt">
  <header>
    <h1>VladiScan</h1>
    <div class="sub">Escaneá el precio en la góndola y sumá al instante</div>
  </header>

  <div class="scan-zone">
    <div class="viewfinder" id="viewfinder">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="frame"><span class="tag">Apuntá al precio</span></div>
      <div class="cam-status" id="camStatus">Iniciando cámara…</div>
    </div>

    <div class="capture-row">
      <button class="btn-primary" id="captureBtn" disabled>📷 Leer Precio</button>
    </div>

    <button class="manual-toggle" id="manualToggle">✏️ Cargar precio manualmente</button>
    <div class="manual-row" id="manualRow">
      <input type="number" id="manualPrice" placeholder="0.00" inputmode="decimal" step="0.01">
      <button class="btn-primary" id="manualAdd">Agregar</button>
    </div>
  </div>

  <div class="items" id="items">
    <div class="empty-state" id="emptyState">
      Tu carrito está vacío.<br>Escaneá un cartel de precio para empezar.
    </div>
  </div>

  <div class="total-block">
    <div class="total-line">
      <span>Productos acumulados</span>
      <span id="countLine">0</span>
    </div>
    <div class="total-line grand">
      <span>Total</span>
      <span>$<span id="grandTotal">0.00</span></span>
    </div>
  </div>

  <footer>
    <div class="footer-actions">
      <button class="btn-secondary" id="clearAll">Vaciar</button>
      <button class="btn-secondary" id="exportExcel">📊 Exportar Excel</button>
    </div>
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal">
    <div class="eyebrow" id="modalEyebrow">Precio Detectado</div>
    <h2 id="modalHint">Confirmá o corregí el valor antes de sumar</h2>
    <img id="modalThumb" class="thumb-preview" style="display:none;">
    
    <label for="modalPrice">Precio ($)</label>
    <input type="number" id="modalPrice" placeholder="0.00" inputmode="decimal" step="0.01">
    
    <label for="modalNote">Nombre o nota del artículo (opcional)</label>
    <input type="text" id="modalNote" placeholder="Ej: Leche entera 1L">
    
    <div class="modal-actions">
      <button class="btn-secondary" id="modalCancel">Cancelar</button>
      <button class="btn-primary" id="modalConfirm">Sumar al carrito</button>
    </div>
  </div>
</div>

<script>
(function(){
  const items = [];
  const itemsEl = document.getElementById('items');
  const emptyState = document.getElementById('emptyState');
  const grandTotalEl = document.getElementById('grandTotal');
  const countLineEl = document.getElementById('countLine');
  const camStatus = document.getElementById('camStatus');
  const captureBtn = document.getElementById('captureBtn');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');

  const modalOverlay = document.getElementById('modalOverlay');
  const modalEyebrow = document.getElementById('modalEyebrow');
  const modalThumb = document.getElementById('modalThumb');
  const modalPrice = document.getElementById('modalPrice');
  const modalNote = document.getElementById('modalNote');

  function formatMoney(n){
    return n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function render(){
    itemsEl.innerHTML = '';
    if(items.length === 0){
      itemsEl.appendChild(emptyState);
    } else {
      items.forEach((it, idx) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="name">${it.note || 'Artículo ' + (idx+1)}</div>
          <div class="price">$${formatMoney(it.price)}</div>
          <button class="remove" data-idx="${idx}" title="Quitar">×</button>
        `;
        itemsEl.appendChild(row);
      });
    }
    const total = items.reduce((acc, it) => acc + it.price, 0);
    grandTotalEl.textContent = formatMoney(total);
    countLineEl.textContent = items.length;
  }

  itemsEl.addEventListener('click', (e) => {
    if(e.target.classList.contains('remove')){
      const idx = parseInt(e.target.dataset.idx, 10);
      items.splice(idx, 1);
      render();
    }
  });

  document.getElementById('clearAll').addEventListener('click', () => {
    if(items.length && !confirm('¿Vaciar todo el carrito?')) return;
    items.length = 0;
    render();
  });

  // Exportar a Excel
  document.getElementById('exportExcel').addEventListener('click', () => {
    if(items.length === 0){
      alert('Todavía no hay productos para exportar.');
      return;
    }
    const rows = items.map((it, idx) => ({
      '#': idx + 1,
      'Descripción': it.note || 'Sin especificación',
      'Precio': it.price,
      'Hora': it.time
    }));
    rows.push({ '#': '', 'Descripción': 'TOTAL ACUMULADO', 'Precio': items.reduce((a,i)=>a+i.price,0), 'Hora': '' });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:5},{wch:30},{wch:14},{wch:10}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'VladiScan');
    const fecha = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `vladiscan-compra-${fecha}.xlsx`);
  });

  // Modal
  let pendingThumb = null;

  function openModal(guessedPrice, thumbDataUrl){
    modalPrice.value = guessedPrice || '';
    modalNote.value = '';
    pendingThumb = thumbDataUrl || null;
    if(thumbDataUrl){
      modalThumb.src = thumbDataUrl;
      modalThumb.style.display = 'block';
    } else {
      modalThumb.style.display = 'none';
    }
    modalEyebrow.textContent = guessedPrice ? 'Precio detectado' : 'Cargar precio';
    modalOverlay.style.display = 'flex';
    setTimeout(() => { modalPrice.focus(); modalPrice.select(); }, 80);
  }

  function closeModal(){ modalOverlay.style.display = 'none'; }

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });

  document.getElementById('modalConfirm').addEventListener('click', () => {
    const price = parseFloat(modalPrice.value);
    if(isNaN(price) || price < 0){ modalPrice.focus(); return; }
    items.push({
      price,
      note: modalNote.value.trim(),
      time: new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})
    });
    render();
    closeModal();
  });

  // Carga manual
  const manualToggle = document.getElementById('manualToggle');
  const manualRow = document.getElementById('manualRow');
  manualToggle.addEventListener('click', () => {
    manualRow.classList.toggle('open');
    if(manualRow.classList.contains('open')) document.getElementById('manualPrice').focus();
  });

  document.getElementById('manualAdd').addEventListener('click', () => {
    const input = document.getElementById('manualPrice');
    const price = parseFloat(input.value);
    if(isNaN(price) || price < 0) return;
    openModal(price, null);
    input.value = '';
  });

  // Extraer precio
  function extractPrice(rawText){
    const cleaned = rawText.replace(/[^\d.,]/g, ' ');
    const matches = cleaned.match(/[\d]{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})?|\d+/g);
    if(!matches || matches.length === 0) return null;
    
    matches.sort((a,b) => b.replace(/[.,]/g,'').length - a.replace(/[.,]/g,'').length);
    let best = matches[0];

    const hasDot = best.includes('.');
    const hasComma = best.includes(',');
    let normalized;
    if(hasDot && hasComma){
      if(best.lastIndexOf(',') > best.lastIndexOf('.')){
        normalized = best.replace(/\./g, '').replace(',', '.');
      } else {
        normalized = best.replace(/,/g, '');
      }
    } else if(hasComma){
      normalized = best.replace(',', '.');
    } else {
      normalized = best;
    }
    const value = parseFloat(normalized);
    return isNaN(value) ? null : value;
  }

  // Cámara
  let stream = null;

  async function startCamera(){
    if(!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia){
      camStatus.textContent = 'Tu navegador no soporta cámara aquí. Usá la carga manual.';
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
      video.srcObject = stream;
      await video.play();
      camStatus.textContent = 'Encuadrá el cartel y tocá "Leer Precio"';
      captureBtn.disabled = false;
    } catch(err){
      camStatus.textContent = 'Sin acceso a la cámara. Podés usar la carga manual.';
      console.error(err);
    }
  }

  captureBtn.addEventListener('click', async () => {
    if(!video.videoWidth) return;
    captureBtn.disabled = true;
    camStatus.textContent = 'Escaneando número…';

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

    try{
      const { data } = await Tesseract.recognize(dataUrl, 'spa+eng', {
        tessedit_char_whitelist: '0123456789.,$'
      });
      const guessed = extractPrice(data.text || '');
      openModal(guessed, dataUrl);
    } catch(err){
      console.error(err);
      openModal(null, dataUrl);
    } finally {
      camStatus.textContent = 'Encuadrá el cartel y tocá "Leer Precio"';
      captureBtn.disabled = false;
    }
  });

  render();
  startCamera();
})();
</script>

</body>
</html>
