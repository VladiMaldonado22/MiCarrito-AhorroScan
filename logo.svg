<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo Oscuro -->
  <rect width="512" height="512" fill="#0f172a" rx="80"/>
  
  <defs>
    <!-- Brillo del Láser Violeta -->
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Código de Barras -->
  <g fill="#cbd5e1">
    <rect x="130" y="260" width="18" height="110" fill="#94a3b8"/>
    <rect x="154" y="260" width="22" height="110" fill="#ffffff"/>
    <rect x="190" y="220" width="26" height="150" fill="#ffffff"/>
    <rect x="222" y="200" width="16" height="170" fill="#94a3b8"/>
    <rect x="244" y="240" width="14" height="130" fill="#94a3b8"/>
    <rect x="270" y="190" width="20" height="180" fill="#cbd5e1"/>
    <rect x="300" y="170" width="16" height="200" fill="#cbd5e1"/>
    <rect x="322" y="130" width="14" height="240" fill="#ffffff"/>
    <rect x="342" y="138" width="12" height="232" fill="#cbd5e1"/>
    <rect x="360" y="100" width="18" height="270" fill="#ffffff"/>
    <rect x="384" y="110" width="10" height="260" fill="#94a3b8"/>
  </g>

  <!-- Línea del Láser Violeta con resplandor -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#818cf8" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="80" y1="180" x2="432" y2="180" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Texto AHORRO SCAN -->
  <text x="256" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="1">
    <tspan fill="#ffffff">AHORRO </tspan>
    <tspan fill="#818cf8">SCAN</tspan>
  </text>
</svg>
